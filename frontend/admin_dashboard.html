<h1>Admin Dashboard - Student Submissions</h1>

<table>

<thead>
<tr>
<th>#</th>
<th>Category</th>
<th>Title</th>
<th>Name</th>
<th>PRN</th>
<th>Email</th>
<th>Description</th>
<th>Proof</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="records"></tbody>

</table>

<script>
if(sessionStorage.getItem("adminLoggedIn")!=="true"){
window.location.href="admin_login.html";
}    

function loadRecords(){

let achievements = JSON.parse(localStorage.getItem("achievements")) || [];

let rows="";

achievements.forEach((a,index)=>{

let statusClass="status-pending";

if(a.status=="Approved") statusClass="status-approved";
if(a.status=="Rejected") statusClass="status-rejected";

rows+=`

<tr>

<td>${index+1}</td>

<td>${a.category}</td>

<td>${a.title}</td>

<td>${a.name}</td>

<td>${a.prn}</td>

<td>${a.email}</td>

<td>${a.description}</td>

<td>
<a href="${a.url}" target="_blank">Open Proof</a>
</td>

<td class="${statusClass}">
${a.status}

${a.reason ? `<div class="reason">Reason: ${a.reason}</div>` : ""}

</td>

<td>

<button class="approve" onclick="approve(${index})">Approve</button>

<button class="reject" onclick="reject(${index})">Reject</button>

<button class="delete" onclick="deleteRecord(${index})">Delete</button>

</td>

</tr>

`;

});

document.getElementById("records").innerHTML=rows;

}

function approve(index){

let achievements = JSON.parse(localStorage.getItem("achievements"));

achievements[index].status="Approved";
achievements[index].reason="";

localStorage.setItem("achievements",JSON.stringify(achievements));

loadRecords();

}

function reject(index){

let reason = prompt("Enter rejection reason:");

if(!reason) return;

let achievements = JSON.parse(localStorage.getItem("achievements"));

achievements[index].status="Rejected";
achievements[index].reason=reason;

localStorage.setItem("achievements",JSON.stringify(achievements));

loadRecords();

}

function deleteRecord(index){

let confirmDelete = confirm("Delete this entry?");

if(!confirmDelete) return;

let achievements = JSON.parse(localStorage.getItem("achievements"));

achievements.splice(index,1);

localStorage.setItem("achievements",JSON.stringify(achievements));

loadRecords();

}

loadRecords();

</script>
